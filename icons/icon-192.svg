<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="40" fill="#1a1a2e"/>
  <!-- Outer ring -->
  <circle cx="96" cy="104" r="64" fill="none" stroke="#0f3460" stroke-width="6"/>
  <!-- Tick marks -->
  <g stroke="#8892a4" stroke-width="2">
    <line x1="96" y1="44" x2="96" y2="52"/>
    <line x1="96" y1="156" x2="96" y2="164"/>
    <line x1="32" y1="104" x2="40" y2="104"/>
    <line x1="152" y1="104" x2="160" y2="104"/>
  </g>
  <!-- Minute hand -->
  <line x1="96" y1="104" x2="96" y2="62" stroke="#eee" stroke-width="4" stroke-linecap="round"/>
  <!-- Second hand -->
  <line x1="96" y1="104" x2="130" y2="80" stroke="#e94560" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="96" cy="104" r="5" fill="#e94560"/>
  <!-- Top button -->
  <rect x="88" y="28" width="16" height="12" rx="3" fill="#0f3460"/>
</svg>
