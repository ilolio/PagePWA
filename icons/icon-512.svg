<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#1a1a2e"/>
  <!-- Outer ring -->
  <circle cx="256" cy="276" r="170" fill="none" stroke="#0f3460" stroke-width="14"/>
  <!-- Tick marks -->
  <g stroke="#8892a4" stroke-width="4">
    <line x1="256" y1="112" x2="256" y2="132"/>
    <line x1="256" y1="420" x2="256" y2="440"/>
    <line x1="86" y1="276" x2="106" y2="276"/>
    <line x1="406" y1="276" x2="426" y2="276"/>
    <!-- Diagonal ticks -->
    <line x1="136.4" y1="156.4" x2="150.5" y2="170.5"/>
    <line x1="375.6" y1="156.4" x2="361.5" y2="170.5"/>
    <line x1="136.4" y1="395.6" x2="150.5" y2="381.5"/>
    <line x1="375.6" y1="395.6" x2="361.5" y2="381.5"/>
  </g>
  <!-- Minute hand -->
  <line x1="256" y1="276" x2="256" y2="156" stroke="#eee" stroke-width="10" stroke-linecap="round"/>
  <!-- Second hand -->
  <line x1="256" y1="276" x2="348" y2="210" stroke="#e94560" stroke-width="6" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="276" r="12" fill="#e94560"/>
  <!-- Top button -->
  <rect x="234" y="68" width="44" height="34" rx="8" fill="#0f3460"/>
</svg>
