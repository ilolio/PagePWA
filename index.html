<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ストップウォッチ</title>
  <meta name="description" content="シンプルなストップウォッチPWAアプリ">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>ストップウォッチ</h1>
    </header>

    <main class="main">
      <div class="display">
        <span id="hours">00</span><span class="sep">:</span><span id="minutes">00</span><span class="sep">:</span><span id="seconds">00</span><span class="sep-ms">.</span><span id="milliseconds">00</span>
      </div>

      <div class="controls">
        <button id="btn-reset" class="btn btn-reset" disabled>リセット</button>
        <button id="btn-start" class="btn btn-start">スタート</button>
        <button id="btn-lap" class="btn btn-lap" disabled>ラップ</button>
      </div>

      <div class="laps-container" id="laps-container">
        <h2 class="laps-title" id="laps-title" hidden>ラップタイム</h2>
        <ul class="laps-list" id="laps-list"></ul>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
